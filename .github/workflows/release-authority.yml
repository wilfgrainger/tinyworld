name: Release authority

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify canonical release authority
        run: bash ./tests/verify-release-authority.sh
      - name: Verify v0.6.3 production art source contract
        run: bash ./tests/verify-v0.6.3-source-contract.sh
      - name: Audit every tracked text line
        run: bash ./tests/verify-v0.6.3-repository-audit.sh
