name: Cleanup old Actions artifacts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-actions-artifacts.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts, keep newest 20
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 20;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            artifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const victims = artifacts.slice(keep);

            core.info(`Found ${artifacts.length} artifacts. Keeping newest ${Math.min(keep, artifacts.length)} and deleting ${victims.length}.`);

            for (const artifact of victims) {
              core.info(`Deleting ${artifact.name} (${artifact.id}) created ${artifact.created_at}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
            }

            core.info('Artifact cleanup complete.');
